# Astral Ruff pre-commit hooks. Run `pre-commit install` once to enable.
# Keep rev in sync with the Ruff version pinned in pyproject.toml / CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Lint, applying autofixes where safe.
      - id: ruff
        args: [--fix]
      # Format.
      - id: ruff-format
